profile: windows-ada-sm89
python: runtime/venv/Scripts/python.exe
torch: 2.10.0+cu130
python_version: '3.13'
hardware_class: nvidia-ada-sm89

packages:
  sageattention: 2.2.0+cu130torch2.10.0andhigher.post6
  triton_windows: 3.7.1.post27
  numpy: 2.3.5
  stanza: 1.10.1

custom_nodes:
  - name: ComfyUI-KJNodes
    repository: https://github.com/kijai/ComfyUI-KJNodes.git
    revision: d3cfe21625e5170126ce06fbfcfe1d88108688c3
    capabilities:
      - PathchSageAttentionKJ
      - MiniMaxH3MemoryEfficientSageAttentionPatch
  - name: comfyui-AGSoft
    repository: https://github.com/Art-xmaster/comfyui-AGSoft.git
    revision: 4d508dff4410ac1ae561d1527217cdbda742eb38
    capabilities:
      - AGSoftMiniMaxH3Cache

experimental_h3_nodes:
  - name: ComfyUI-MiniMaxH3-TeaCache
    repository: https://github.com/Icyoung/ComfyUI-MiniMaxH3-TeaCache.git
    revision: 4cbb50d69c73a19a5d6ec42c5aec1989d5a04b6f
    capabilities:
      - MiniMaxH3TeaCache
  - name: ComfyUI-Spectrum-MiniMax-H3
    repository: https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3.git
    revision: 120d72e2f48b781235b34149e39bbdf0f1317d82
    capabilities:
      - SpectrumApplyMiniMaxH3
  - name: comfyui-speed-minimaxH3
    repository: https://github.com/linjian-ufo/comfyui-speed-minimaxH3.git
    revision: 2f507d687cd6767212ae003d272042bf886a3cd3
    capabilities:
      - MiniMaxH3SpeedCache
      - MiniMaxH3TextEncoderCache
  - name: ComfyUI-MiniMax-H3-FastPath
    repository: https://github.com/capitan01R/ComfyUI-MiniMax-H3-FastPath.git
    revision: 23575c19bf85e541fd1d3dbbbee86e3bf5a55722
    capabilities:
      - MiniMaxH3EulerMiddleCache

validation:
  startup_switch: -UseSageAttention
  sage_backend: sage
  default_backend: kitchen
  compile: false
