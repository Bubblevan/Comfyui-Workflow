schema_version: 1
id: effect.charm.heart_highlight
version: 1
title: Small heart-shaped pupil highlights
category: effect
tags:
  - charm
  - eyes
  - highlight
  - non-explicit

safety:
  adult_only: true
  fictional_only: true
  consent_model: explicit_roleplay
  prohibited_contexts:
    - minors_or_age_ambiguous_characters
    - non_consensual_sexual_activity
    - real_person_sexualization

prompt:
  opening:
    framing: medium_close_up
    view: three_quarter_front
    description: >
      The adult fictional character is shown in a newly generated medium close-up with both eyes
      clearly visible, preserving the original eye shape and ordinary highlights.
  beats:
    - start: 0.0
      end: 1.7
      description: >
        The character looks forward with a calm expression and blinks once. The original eye shape,
        pupils, iris colors, and catchlights remain stable.
    - start: 1.7
      end: 3.5
      description: >
        A small sharply defined heart-shaped highlight gradually appears at the center of each pupil.
        The heart shapes are symmetrical and do not replace the eyes or irises.
    - start: 3.5
      end: 5.0
      description: >
        The small heart-shaped pupil highlights remain stable while the character holds a soft,
        composed forward gaze with no other facial or body transformation.
  ending: >
    Stable close-up with small symmetrical heart-shaped highlights centered in both pupils,
    while the original eyes remain intact.
  constraints:
    - exactly one adult fictional character
    - preserve the original eye shape, iris, pupils, face identity, hair, clothing, and proportions
    - do not replace the entire eye with a heart shape
    - keep both heart highlights small, centered, and symmetrical
    - no extra pupils, eye deformation, scene cuts, text, or watermark
    - no explicit sexual action

compatibility:
  model_family: MiniMax H3 Ref2VA
  reference_mode: reference_generation
  recommended_duration: 5
  recommended_references:
    - primary
    - face
  sampler: Euler
  scheduler: beta
  notes:
    - Treat as charm or infatuation visual language, not as the concentric-ring hypnosis card.

provenance:
  source_type: original_local
  source_ids:
    - h3_prompt_guide_ref
  license_status: local_original
  notes: Local prompt card; no third-party asset is bundled.

review:
  status: reviewed
  reviewer: local-harness
  last_reviewed: '2026-09-16'
  known_issues: []
