schema_version: 1
id: effect.hypnosis.loss_of_catchlights
version: 1
title: Loss of catchlights
category: effect
tags:
  - hypnosis
  - eyes
  - state-transition
  - non-explicit

safety:
  adult_only: true
  fictional_only: true
  consent_model: explicit_roleplay
  prohibited_contexts:
    - minors_or_age_ambiguous_characters
    - non_consensual_sexual_activity
    - real_person_sexualization

prompt:
  opening:
    framing: medium_close_up
    view: three_quarter_front
    description: >
      The adult fictional character is shown in a newly generated medium close-up.
      Both eyes are clearly visible, with their original iris color and normal bright catchlights.
  beats:
    - start: 0.0
      end: 1.5
      description: >
        The character looks forward normally with a composed expression and blinks once.
        Both irises retain their original color and bright natural catchlights.
    - start: 1.5
      end: 3.0
      description: >
        The gaze slowly loses focus. The bright catchlights in both eyes gradually fade away
        while the eyelids relax slightly and head movement becomes minimal.
    - start: 3.0
      end: 5.0
      description: >
        Both eyes remain without catchlights. The expression becomes distant and still while
        the character holds a quiet vacant stare without changing facial proportions.
  ending: >
    Stable medium close-up with symmetrical absent catchlights, relaxed eyelids,
    and a fixed distant expression.
  constraints:
    - exactly one adult fictional character
    - preserve identity, face shape, eye shape, hair, clothing, and body proportions
    - change only catchlight visibility, gaze focus, eyelid tension, and facial stillness
    - keep both eyes clearly visible throughout
    - no eye deformation
    - no extra pupils or mismatched eyes
    - no scene cuts or camera orbit
    - no explicit sexual action, text, or watermark

compatibility:
  model_family: MiniMax H3 Ref2VA
  reference_mode: reference_generation
  recommended_duration: 5
  recommended_references:
    - primary
    - face
  sampler: Euler
  scheduler: beta
  notes:
    - Use as a single-variable control before adding iris color or pattern changes.
    - Prefer a face reference and a medium close-up so both eyes remain observable.

provenance:
  source_type: adapted_from_research
  source_ids:
    - h3_prompt_guide_ref
    - comfyui_h3_r2v_template
  license_status: local_original
  notes: First local control card derived from the user-provided H3 research summary.

review:
  status: reviewed
  reviewer: local-harness
  last_reviewed: '2026-09-16'
  known_issues:
    - This card tests a visual state change, not a model-specific hypnosis LoRA.
