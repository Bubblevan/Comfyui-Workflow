schema_version: 1
id: effect.hypnosis.concentric_ring_eyes
version: 1
title: Concentric ring iris pattern
category: effect
tags:
  - hypnosis
  - eyes
  - iris-pattern
  - non-explicit

safety:
  adult_only: true
  fictional_only: true
  consent_model: explicit_roleplay
  prohibited_contexts:
    - minors_or_age_ambiguous_characters
    - non_consensual_sexual_activity
    - real_person_sexualization

prompt:
  opening:
    framing: medium_close_up
    view: three_quarter_front
    description: >
      The adult fictional character is shown in a newly generated medium close-up.
      Both eyes are clearly visible with their original shape, pupils, and ordinary catchlights.
  beats:
    - start: 0.0
      end: 1.4
      description: >
        The character looks forward normally with a composed expression and one natural blink.
    - start: 1.4
      end: 2.8
      description: >
        The gaze becomes slightly unfocused and faint symmetrical concentric rings begin to emerge
        inside both irises, centered precisely around the pupils.
    - start: 2.8
      end: 4.2
      description: >
        The concentric rings become progressively clearer and evenly spaced in both eyes while
        the original eye shape and facial proportions remain stable.
    - start: 4.2
      end: 5.0
      description: >
        The transformation settles into stable symmetrical ring patterns with a quiet distant gaze.
        Keep the character nearly still until the end.
  ending: >
    Stable medium close-up with clear symmetrical concentric iris rings,
    preserved eye shape, and a fixed distant expression.
  constraints:
    - exactly one adult fictional character
    - preserve face identity, eye shape, hair, clothing, and body proportions
    - both eyes must transform symmetrically
    - keep ring patterns centered inside the irises
    - no extra pupils, crossed eyes, eye deformation, or mismatched eyes
    - no scene cuts, camera orbit, text, or watermark
    - no explicit sexual action

compatibility:
  model_family: MiniMax H3 Ref2VA
  reference_mode: reference_generation
  recommended_duration: 5
  recommended_references:
    - primary
    - face
  sampler: Euler
  scheduler: beta
  notes:
    - Use a face reference; avoid adding pose or action references in the first A/B.
    - Keep this separate from the dark-pink card to isolate pattern failure modes.

provenance:
  source_type: adapted_from_research
  source_ids:
    - h3_prompt_guide_ref
  license_status: local_original
  notes: Visual state-transition card derived from the user-provided research summary.

review:
  status: reviewed
  reviewer: local-harness
  last_reviewed: '2026-09-16'
  known_issues:
    - Ring geometry may require multiple seeds and manual frame review.
