schema_version: 1
id: camera.medium_closeup_eye_detail
version: 1
title: Medium close-up for eye detail
category: camera
tags:
  - camera
  - medium-close-up
  - eyes
  - non-explicit

safety:
  adult_only: true
  fictional_only: true
  consent_model: explicit_roleplay
  prohibited_contexts:
    - minors_or_age_ambiguous_characters
    - non_consensual_sexual_activity
    - real_person_sexualization

prompt:
  opening:
    framing: medium_close_up
    view: three_quarter_front
    description: >
      Frame the adult fictional character from the upper chest to the top of the head.
      The face occupies a large portion of the image and both eyes remain unobstructed.
  beats:
    - start: 0.0
      end: 5.0
      description: >
        Maintain a stable medium close-up with a very small slow push-in. Keep both eyes,
        eyebrows, nose, mouth, and facial outline in frame without cropping the face.
  ending: Stable medium close-up with both eyes clearly readable.
  constraints:
    - exactly one adult fictional character
    - no face crop that removes either eye
    - no camera orbit, roll, zoom jump, scene cut, text, or watermark

compatibility:
  model_family: MiniMax H3 Ref2VA
  reference_mode: reference_generation
  recommended_duration: 5
  recommended_references:
    - primary
    - face
  sampler: Euler
  scheduler: beta
  notes:
    - Pair with eye-effect cards when the target variable is iris or catchlight behavior.

provenance:
  source_type: original_local
  source_ids:
    - h3_prompt_guide_ref
  license_status: local_original
  notes: Camera card based on the user-provided H3 eye-transition experiment.

review:
  status: reviewed
  reviewer: local-harness
  last_reviewed: '2026-09-16'
  known_issues: []
