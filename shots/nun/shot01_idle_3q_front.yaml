id: shot01_idle_3q_front
character: nun
reference_mode: reference_generation

references:
  - primary
  - alternate
  - face

duration: 5

opening:
  framing: medium_full
  view: three_quarter_front
  description: >
    The character is already standing in a newly generated three-quarter front
    pose, facing slightly left of the camera, with her face, upper body, and
    hands clearly visible.

beats:
  - start: 0.0
    end: 1.5
    description: >
      She holds a calm pose and blinks once.
  - start: 1.5
    end: 3.5
    description: >
      She gently turns her head, adjusts the edge of her collar, and lowers her hand.
  - start: 3.5
    end: 5.0
    description: >
      She returns to a composed standing pose and holds it steadily.

ending:
  description: Stable three-quarter front composed standing pose.

camera:
  framing: medium_full
  type: push_in
  amplitude: small
  speed: slow

audio:
  policy: silent

constraints:
  - exactly one character
  - preserve blonde hair and purple-red eyes
  - preserve black-and-white nun habit and black head covering
  - preserve stable face identity and body proportions
  - no scene cuts
  - no camera orbit
  - no extra characters
  - no text
  - no watermark
  - plain light-gray background only

generation:
  explore:
    megapixels: 0.5
    steps: 4
    turbo: true
    takes: 4
  keep:
    megapixels: 0.75
    steps: 8
    turbo: true
    takes: 1
