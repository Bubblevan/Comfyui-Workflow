id: shot03_3q_front_low
character: nun
reference_mode: reference_generation

references:
  - primary
  - alternate
  - face

duration: 5

opening:
  framing: medium
  view: three_quarter_front_low_angle
  description: >
    The character is already standing in a newly generated three-quarter front
    pose viewed from a slightly low camera angle, with her face and upper body
    clearly visible and a restrained heroic presence.

beats:
  - start: 0.0
    end: 1.5
    description: >
      She holds the pose, raises her chin slightly, and keeps a calm forward gaze.
  - start: 1.5
    end: 3.5
    description: >
      She shifts her weight subtly, turns her head a small amount, and steadies her posture.
  - start: 3.5
    end: 5.0
    description: >
      She settles into the composed stance and holds the final pose without further movement.

ending:
  description: Stable three-quarter front pose with a subtle heroic presence and clear face visibility.

camera:
  framing: medium
  type: push_in
  amplitude: small
  speed: slow

audio:
  policy: silent

constraints:
  - exactly one character
  - preserve blonde hair and purple-red eyes
  - preserve black-and-white nun habit and black head covering
  - preserve stable face identity and body proportions
  - keep the low angle subtle
  - no scene cuts
  - no camera orbit
  - no extra characters
  - no text
  - no watermark
  - plain light-gray background only

generation:
  explore:
    megapixels: 0.5
    steps: 4
    turbo: true
    takes: 4
  keep:
    megapixels: 0.75
    steps: 8
    turbo: true
    takes: 1
